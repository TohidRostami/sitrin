services:
  app:
    build: .
    restart: always
    env_file:
      - .env
    volumes:
      # فایل SQLite این‌جا زندگی می‌کنه — با rebuild شدن ایمیج (docker compose
      # up --build) پاک نمی‌شه، چون جدا از فایل‌سیستم کانتینر ذخیره می‌شه.
      - app-data:/app/data
    networks:
      - web
    # پورت به هاست باز نمی‌شه — فقط Caddy از طریق شبکه‌ی داخلی بهش می‌رسه.
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # گواهی SSL و کش داخلی Caddy — با این ولیوم‌ها، با هر ری‌استارت
      # دوباره از Let's Encrypt گواهی نمی‌گیره (که محدودیت نرخ درخواست داره).
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - web
    depends_on:
      - app

networks:
  web:

volumes:
  app-data:
  caddy-data:
  caddy-config:
